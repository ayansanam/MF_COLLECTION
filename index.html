<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MF COLLECTION</title>


    <style>

        /* =========================
           BASIC SETTINGS
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef6ff;
            color: #222;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px #cdd9e5;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #1769aa;
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 18px;
            font-size: 15px;
        }

        nav a:hover {
            color: #1769aa;
        }


        /* =========================
           TOP BANNER
        ========================= */

        .top-banner {
            background: linear-gradient(
                120deg,
                #1769aa,
                #4facfe,
                #00c6ff
            );

            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 480px;

            background:
                linear-gradient(
                    rgba(0, 60, 120, 0.55),
                    rgba(0, 130, 200, 0.35)
                ),
                url("IPO.jpeg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px 20px;
        }

        .hero-content {
            background: rgba(255, 255, 255, 0.92);
            padding: 35px;
            border-radius: 18px;
            max-width: 650px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .hero h1 {
            color: #1769aa;
            font-size: 45px;
            margin: 0 0 10px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
        }

        .shop-button {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 28px;
            background: #1769aa;
            color: white;
            text-decoration: none;
            border-radius: 25px;
        }

        .shop-button:hover {
            background: #0d4f83;
        }


        /* =========================
           VIDEO STYLE AREA
        ========================= */

        .video-section {
            text-align: center;
            padding: 45px 20px;
            background: white;
        }

        .video-box {
            max-width: 800px;
            margin: auto;
            background: #dff3ff;
            border-radius: 18px;
            padding: 15px;
        }

        .video-box video {
            width: 100%;
            max-height: 380px;
            border-radius: 12px;
            background: #c5e8fa;
        }

        .video-box p {
            color: #555;
            margin-bottom: 5px;
        }


        /* =========================
           SECTION
        ========================= */

        section {
            padding: 55px 6%;
        }

        .title {
            text-align: center;
            color: #1769aa;
            font-size: 30px;
            margin-bottom: 35px;
        }


        /* =========================
           PRODUCTS
        ========================= */

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .product {
            background: white;
            width: 245px;
            padding: 15px;
            border-radius: 15px;
            text-align: center;

            box-shadow: 0 5px 18px #d5e2ed;

            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-7px);
        }

        .product img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 12px;
        }

        .product h3 {
            font-size: 18px;
            min-height: 42px;
        }

        .price {
            color: #1769aa;
            font-size: 21px;
            font-weight: bold;
        }

        .order-button {
            border: none;
            background: #20bf55;
            color: white;
            padding: 12px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .order-button:hover {
            background: #159642;
        }


        /* =========================
           ABOUT / FEATURES
        ========================= */

        .features {
            background: #dff2ff;
            text-align: center;
        }

        .feature-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .feature {
            background: white;
            width: 220px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #cbdce9;
        }

        .feature h3 {
            color: #1769aa;
        }


        /* =========================
           REVIEWS
        ========================= */

        .reviews {
            max-width: 650px;
            margin: auto;
        }

        .review-form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #d5e2ed;
        }

        .review-form input,
        .review-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .review-form button {
            background: #1769aa;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            cursor: pointer;
        }

        .review {
            background: white;
            margin-top: 15px;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #d5e2ed;
        }

        .review strong {
            color: #1769aa;
        }


        /* =========================
           CONTACT
        ========================= */

        .contact {
            background: white;
            text-align: center;
        }

        .number {
            color: #20a84b;
            font-size: 20px;
            font-weight: bold;
            margin: 8px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #1769aa;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        footer h2 {
            margin-top: 0;
        }


        /* =========================
           FLOATING WHATSAPP
        ========================= */

        .whatsapp {
            position: fixed;
            right: 20px;
            bottom: 20px;

            width: 58px;
            height: 58px;

            background: #20bf55;
            color: white;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            text-decoration: none;

            font-size: 27px;

            box-shadow: 0 4px 15px #999;

            z-index: 200;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 12px;
            }

            nav {
                text-align: center;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }

            .hero h1 {
                font-size: 35px;
            }

            .hero-content {
                padding: 25px;
            }

            .product {
                width: 90%;
                max-width: 320px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="logo">
            MF COLLECTION
        </div>

        <nav>

            <a href="#home">Home</a>

            <a href="#accessories">Accessories</a>

            <a href="#fashion">Fashion</a>

            <a href="#jewellery">Jewellery</a>

            <a href="#reviews">Reviews</a>

            <a href="#contact">Contact</a>

        </nav>

    </header>


    <!-- TOP OFFER -->

    <div class="top-banner">

        ✨ Welcome to MF COLLECTION — Shop Our Latest Collection ✨

    </div>


    <!-- =========================
         HERO
    ========================= -->

    <section class="hero" id="home">

        <div class="hero-content">

            <h1>MF COLLECTION</h1>

            <p>
                Fashion, Jewellery & Accessories
            </p>

            <p>
                Simple shopping. Easy WhatsApp ordering.
            </p>

            <a href="#fashion" class="shop-button">
                Shop Now
            </a>

        </div>

    </section>


    <!-- =========================
         VIDEO AREA
    ========================= -->

    <section class="video-section">

        <h2 class="title">
            🎥 Featured Collection
        </h2>

        <div class="video-box">
